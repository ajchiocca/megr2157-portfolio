site_name: AJ Chiocca's MEGR 2157 Portfolio
site_description: MEGR 2157 engineering portfolio
site_url: https://ajchiocca.github.io/megr2157-portfolio/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/pencil-ruler
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes      # needs assignments/index.md — see below
    - toc.follow              # NOT toc.integrate — conflicts with navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    # navigation.tracking and header.autohide removed — both cause
    # instability when combined with instant loading

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true

nav:
  - Home: index.md
  - About Me: aboutme/index.md
  - Portfolio Overview: portfolio-overview.md
  - Assignments:
      - assignments/index.md
      - A1: assignments/A01/index.md
      - A2: assignments/A02/index.md
      - A3: assignments/A03/index.md
      - A4: assignments/A04/index.md
      - A5: assignments/A05/index.md
      - A6: assignments/A06/index.md
      - A7: assignments/A07/index.md
      - A8: assignments/A08/index.md
      - A9: assignments/A09/index.md
      - A10: assignments/A10/index.md
      - A11: assignments/A11/index.md
